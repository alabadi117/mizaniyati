<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميزانيتي">
<meta name="theme-color" content="#0f2742">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>ميزانيتي</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#0f2742;--mut:#6b7c8f;--navy:#0f2742;--green:#1f9d6b;--warn:#e0a100;--red:#d64545;--line:#e3eae7;--bar:#e6eeeb;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1626;--card:#122339;--ink:#eaf2f8;--mut:#8ea3b8;--navy:#0a1626;--green:#2fc08a;--line:#1d3350;--bar:#1d3350;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a1626;--card:#122339;--ink:#eaf2f8;--mut:#8ea3b8;--navy:#0a1626;--green:#2fc08a;--line:#1d3350;--bar:#1d3350;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Geeza Pro","Tajawal","Segoe UI",system-ui,sans-serif;font-size:16px;padding-top:env(safe-area-inset-top,0px)}
#app{max-width:560px;margin:0 auto;padding:12px 14px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--green));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.mon{display:flex;align-items:center;gap:6px}
.mon b{min-width:96px;text-align:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ib{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.hero{background:linear-gradient(150deg,#0f2742,#17496b 70%,#1f9d6b);color:#fff;border-radius:22px;padding:18px}
.hero small{opacity:.75}
.hero .big{font-size:34px;font-weight:800;margin:2px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:90px}
.st{background:rgba(255,255,255,.12);border-radius:14px;padding:9px 11px;font-size:13px}
.st b{display:block;font-size:16px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px}
.cat{display:flex;gap:11px;align-items:center}
.cat .ic{width:42px;height:42px;border-radius:13px;background:var(--bar);display:grid;place-items:center;font-size:22px;flex:none}
.cat .in{flex:1;min-width:0}
.cat .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.sub{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:3px}
.bar{height:8px;border-radius:8px;background:var(--bar);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--green)}
.w .bar i{background:var(--warn)}.o .bar i{background:var(--red)}
.alert{border-radius:12px;padding:9px 12px;margin-top:10px;font-size:14px}
.alert.w{background:#fff4d6;color:#7a5900}.alert.o{background:#fde4e4;color:#8f2323}
h3{margin:18px 2px 0;font-size:16px}
.nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.nav button span{font-size:20px}.nav button.on{color:var(--green);font-weight:700}
.fab{width:56px;height:56px;border-radius:50%!important;background:var(--green)!important;color:#fff!important;font-size:30px!important;margin-top:-26px;box-shadow:0 6px 16px rgba(31,157,107,.45);flex:none!important;display:grid!important;place-items:center}
.btn{background:var(--green);color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;width:100%;margin-top:8px}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--red)}
.mask{position:fixed;inset:0;background:rgba(5,15,30,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}.tx small{color:var(--mut);display:block}
.neg{color:var(--red)}.pos{color:var(--green)}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.tabs{display:flex;gap:6px;margin-top:10px}.tabs button{flex:1;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px}.tabs .on{background:var(--navy);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<script>
/* ============ 1) المنطق والحسابات (مفصول عن الواجهة) ============ */
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const sum=a=>r2(a.reduce((s,x)=>s+x,0));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const monthKey=(d=new Date())=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const shiftKey=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return monthKey(d)};
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const mName=k=>{const[y,m]=k.split('-');return MN[m-1]+' '+y};
const DEFAULT_CATS=[['مصروف الأسرة','👨‍👩‍👧'],['المنزل والمقاضي','🛒'],['السيارة والبنزين','🚗'],['الفواتير والاتصالات','💡'],['المطاعم والترفيه','🍽️'],['المصروف الشخصي','👤'],['الادخار','💰'],['السفر والإجازات','✈️'],['الطوارئ','🚨']];
const newCat=(name,icon,type='fixed',val=0)=>({id:uid(),name,icon,type,val,carry:0,saving:name==='الادخار'});

function calc(m){
  const income=r2(m.salary+sum(m.extra.map(e=>e.amt)));
  const cats=m.cats.map(c=>{
    const base=c.type==='pct'?r2(income*c.val/100):r2(c.val);
    const tin=sum(m.transfers.filter(t=>t.to===c.id).map(t=>t.amt));
    const tout=sum(m.transfers.filter(t=>t.from===c.id).map(t=>t.amt));
    const alloc=r2(base+(c.carry||0)+tin-tout);
    const spent=sum(m.tx.filter(t=>t.cat===c.id).map(t=>t.amt));
    return{...c,base,alloc,spent,rem:r2(alloc-spent),pct:alloc>0?spent/alloc*100:(spent>0?101:0)};
  });
  const baseTotal=sum(cats.map(c=>c.base));
  const spent=sum(cats.map(c=>c.spent));
  const allocTotal=sum(cats.map(c=>c.alloc));
  return{income,cats,baseTotal,allocTotal,spent,remaining:r2(allocTotal-spent),undist:r2(income-baseTotal),
    spendPct:income?spent/income*100:0,
    savePct:income?sum(cats.filter(c=>c.saving).map(c=>c.base))/income*100:0};
}

/* ============ 2) التخزين (محلي) ============ */
const KEY='mizaniyati.v1';
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S)S={v:1,cur:monthKey(),months:{},theme:'auto'};ensure(S.cur)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('تعذر الحفظ على الجهاز. صدّر نسخة احتياطية الآن.')}}
function ensure(k){
  if(S.months[k])return;
  const prevK=Object.keys(S.months).filter(x=>x<k).sort().pop();
  const m={salary:0,extra:[],cats:[],tx:[],transfers:[]};
  if(prevK){const pm=S.months[prevK],pc=calc(pm);
    m.salary=pm.salary;
    const carry=confirm('نسخ مخصصات '+mName(prevK)+' للشهر الجديد.\nهل ترحّل المتبقي من كل فئة إلى '+mName(k)+'؟ (موافق = ترحيل، إلغاء = بدون ترحيل)');
    m.cats=pm.cats.map(c=>({...c,id:c.id,carry:carry?Math.max(0,pc.cats.find(x=>x.id===c.id).rem):0}));
  } else m.cats=DEFAULT_CATS.map(([n,i])=>newCat(n,i));
  S.months[k]=m;save();
}
const M=()=>S.months[S.cur];
const fmt=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('ar-SA-u-nu-latn',{maximumFractionDigits:2});
const cur=n=>fmt(n)+' ر.س';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ 3) الواجهة ============ */
let tab='home',q='',fcat='';
const $=s=>document.querySelector(s);
const TABS=[['home','🏠','الرئيسية'],['cats','🎯','المخصصات'],['add','+','إضافة'],['rep','📊','التقارير'],['log','🧾','السجل'],['set','⚙️','الإعدادات']];
function applyTheme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
function render(){
  applyTheme();
  $('#nav').innerHTML=TABS.map(([k,i,l])=>k==='add'?`<button class="fab" data-a="add" aria-label="إضافة مصروف">+</button>`:`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}"><span>${i}</span>${l}</button>`).join('');
  const m=M(),c=calc(m);
  const head=`<div class="top"><div class="logo"><i>م</i>ميزانيتي</div><div class="mon"><button class="ib" data-a="mon" data-v="-1" aria-label="الشهر التالي">›</button><b>${mName(S.cur)}</b><button class="ib" data-a="mon" data-v="1" aria-label="الشهر السابق">‹</button></div></div>`;
  $('#app').innerHTML=head+({home:vHome,cats:vCats,rep:vRep,log:vLog,set:vSet}[tab])(m,c);
  scrollTo(0,0);
}
const catCard=c=>{const cl=c.pct>100?'o':c.pct>=75?'w':'';
  return`<div class="card cat ${cl}" data-a="catdet" data-id="${c.id}"><div class="ic">${c.icon}</div><div class="in"><div class="h"><span>${esc(c.name)}</span><span class="${c.rem<0?'neg':''}">${cur(c.rem)}</span></div><div class="bar"><i style="width:${Math.min(100,c.pct)}%"></i></div><div class="sub"><span>مخصص ${fmt(c.alloc)} • صُرف ${fmt(c.spent)}</span><span>${Math.round(c.pct)}%</span></div></div></div>`};
function vHome(m,c){
  if(!m.salary&&!m.extra.length)return`<div class="card empty">ابدأ بإدخال راتبك الشهري ثم وزّعه على الفئات.<button class="btn" data-a="salary">إدخال الراتب</button></div>`;
  const alerts=c.cats.filter(x=>x.pct>=75).sort((a,b)=>b.pct-a.pct).map(x=>`<div class="alert ${x.pct>100?'o':'w'}">${x.icon} ${esc(x.name)}: ${x.pct>100?'تجاوزت المخصص بمقدار '+cur(-x.rem):x.pct>=90?'استهلكت أكثر من 90%':'استهلكت أكثر من 75%'}</div>`).join('');
  return`<div class="hero"><small>المتبقي من المخصصات</small><div class="big">${cur(c.remaining)}</div><div class="row"><div class="st">الراتب والدخل<b>${fmt(c.income)}</b></div><div class="st">المصروف<b>${fmt(c.spent)}</b></div><div class="st">المخصصات<b>${fmt(c.allocTotal)}</b></div><div class="st">نسبة الصرف<b>${Math.round(c.spendPct)}%</b></div><div class="st">الادخار<b>${Math.round(c.savePct)}%</b></div><div class="st">غير موزع<b class="${c.undist<0?'neg':''}">${fmt(c.undist)}</b></div></div></div>${alerts}<h3>الفئات</h3>${c.cats.map(catCard).join('')||'<div class="empty">لا توجد فئات</div>'}`;
}
function vCats(m,c){
  return`<div class="card"><div class="sub" style="font-size:15px"><span>الراتب</span><b style="color:var(--ink)">${cur(m.salary)}</b></div><div class="sub" style="font-size:15px"><span>دخل إضافي</span><b style="color:var(--ink)">${cur(sum(m.extra.map(e=>e.amt)))}</b></div><div class="sub" style="font-size:15px"><span>إجمالي التخصيص الأساسي</span><b style="color:var(--ink)">${cur(c.baseTotal)}</b></div><div class="sub" style="font-size:15px"><span>غير الموزع</span><b class="${c.undist<0?'neg':'pos'}">${cur(c.undist)}</b></div>
  <div class="row"><button class="btn" data-a="salary">تعديل الراتب</button><button class="btn g" data-a="income">+ دخل إضافي</button></div><div class="row"><button class="btn g" data-a="newcat">+ فئة جديدة</button><button class="btn g" data-a="transfer">⇄ نقل بين فئات</button></div></div>${c.cats.map(x=>`<div class="card cat" data-a="editcat" data-id="${x.id}"><div class="ic">${x.icon}</div><div class="in"><div class="h"><span>${esc(x.name)}</span><span>${x.type==='pct'?x.val+'% = ':''}${cur(x.base)}</span></div><div class="sub"><span>${x.carry?'مرحّل '+fmt(x.carry)+' • ':''}الإجمالي بعد التحويلات ${fmt(x.alloc)}</span><span>تعديل ✎</span></div></div></div>`).join('')}`;
}
function vRep(m,c){
  const days={};m.tx.forEach(t=>days[t.date]=r2((days[t.date]||0)+t.amt));
  const dk=Object.keys(days).sort(),n=dk.length;
  const top=[...c.cats].sort((a,b)=>b.spent-a.spent),max=Math.max(1,...top.map(x=>x.spent));
  const peak=dk.sort((a,b)=>days[b]-days[a])[0];
  const prevK=shiftKey(S.cur,-1),pm=S.months[prevK],pc=pm&&calc(pm);
  return`<div class="card"><div class="sub" style="font-size:15px"><span>إجمالي المصروف</span><b style="color:var(--ink)">${cur(c.spent)}</b></div><div class="sub" style="font-size:15px"><span>متوسط المصروف اليومي (أيام فيها صرف)</span><b style="color:var(--ink)">${cur(n?r2(c.spent/n):0)}</b></div><div class="sub" style="font-size:15px"><span>أعلى يوم إنفاقاً</span><b style="color:var(--ink)">${peak?peak+' • '+fmt(days[peak]):'—'}</b></div>${pc?`<div class="sub" style="font-size:15px"><span>الفرق عن ${mName(prevK)}</span><b class="${c.spent>pc.spent?'neg':'pos'}">${cur(r2(c.spent-pc.spent))}</b></div>`:''}</div>
  <h3>المصروف حسب الفئة</h3>${top.map(x=>`<div class="card"><div class="h" style="display:flex;justify-content:space-between"><span>${x.icon} ${esc(x.name)}</span><b>${cur(x.spent)}</b></div><div class="bar"><i style="width:${x.spent/max*100}%"></i></div><div class="sub"><span>المخصص ${fmt(x.alloc)}</span><span>${c.spent?Math.round(x.spent/c.spent*100):0}% من المصروف</span></div></div>`).join('')}
  <h3>المصروف اليومي</h3><div class="card">${n?dk.sort().reverse().map(d=>`<div class="tx"><span>${d}</span><b>${cur(days[d])}</b></div>`).join(''):'<div class="empty">لا مصروفات بعد</div>'}</div>`;
}
const PAY={cash:'نقدي',card:'بطاقة',bank:'تحويل بنكي'};
function entries(m){
  const nm=id=>(m.cats.find(c=>c.id===id)||{name:'محذوفة',icon:'❔'});
  return[...m.tx.map(t=>({k:'tx',id:t.id,date:t.date,ts:t.ts||0,t:t.desc||nm(t.cat).name,s:nm(t.cat).icon+' '+nm(t.cat).name+' • '+(PAY[t.pay]||''),amt:-t.amt})),
  ...m.extra.map(e=>({k:'in',id:e.id,date:e.date,ts:e.ts||0,t:e.desc||'دخل إضافي',s:'💵 دخل',amt:e.amt})),
  ...m.transfers.map(t=>({k:'tr',id:t.id,date:t.date,ts:t.ts||0,t:'نقل: '+nm(t.from).name+' ← '+nm(t.to).name,s:'⇄ تحويل (لا يُحتسب مصروفاً)',amt:t.amt,neutral:1}))]
  .sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
}
function vLog(m,c){
  let list=entries(m).filter(e=>!q||(e.t+e.s).includes(q));
  if(fcat)list=list.filter(e=>e.k==='tx'&&m.tx.find(t=>t.id===e.id).cat===fcat);
  return`<div class="card"><input id="q" placeholder="بحث في السجل" value="${esc(q)}"><label>تصفية حسب الفئة</label><select id="fc"><option value="">كل الفئات</option>${m.cats.map(x=>`<option value="${x.id}" ${fcat===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="card">${list.length?list.map(e=>`<div class="tx" data-a="${e.k==='tx'?'edittx':'delother'}" data-id="${e.id}" data-k="${e.k}"><div><b>${esc(e.t)}</b><small>${e.date} • ${esc(e.s)}</small></div><b class="${e.neutral?'':e.amt<0?'neg':'pos'}">${e.neutral?'':e.amt<0?'-':'+'}${fmt(Math.abs(e.amt))}</b></div>`).join(''):'<div class="empty">لا توجد عمليات</div>'}</div>`;
}
function vSet(){
  return`<div class="card"><label>المظهر</label><select id="th"><option value="auto" ${S.theme==='auto'?'selected':''}>تلقائي</option><option value="light" ${S.theme==='light'?'selected':''}>فاتح</option><option value="dark" ${S.theme==='dark'?'selected':''}>داكن</option></select></div>
  <div class="card"><b>النسخ الاحتياطي</b><div class="sub">بياناتك محفوظة على هذا الجهاز فقط. صدّر نسخة بانتظام.</div><button class="btn" data-a="expjson">تصدير كل البيانات (JSON)</button><button class="btn g" data-a="expcsv">تصدير المصروفات (CSV لـ Excel)</button><button class="btn g" data-a="imp">استيراد نسخة احتياطية</button><button class="btn g" onclick="print()">طباعة / حفظ PDF</button><input type="file" id="file" accept=".json" hidden></div>
  <div class="card"><b>بيانات تجريبية</b><div class="sub">للتجربة فقط، ويمكن حذفها بالكامل.</div><button class="btn g" data-a="sample">إضافة بيانات تجريبية للشهر الحالي</button><button class="btn d" data-a="wipe">حذف كل البيانات</button></div>`;
}

/* ---- نماذج ---- */
function form(title,fields,onSave,extra=''){
  const mask=document.createElement('div');mask.className='mask';
  mask.innerHTML=`<div class="sheet"><b style="font-size:18px">${title}</b>${fields.map(f=>`<label>${f.l}</label>`+(f.t==='select'?`<select name="${f.k}">${f.o.map(([v,l])=>`<option value="${v}" ${String(f.v)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" step="any"':''} value="${esc(f.v??'')}">`)).join('')}<button class="btn" id="ok">حفظ</button>${extra}<button class="btn g" id="cx">إلغاء</button></div>`;
  document.body.appendChild(mask);
  const close=()=>mask.remove();
  mask.onclick=e=>{if(e.target===mask)close()};
  mask.querySelector('#cx').onclick=close;
  mask.querySelector('#ok').onclick=()=>{const v={};fields.forEach(f=>{const el=mask.querySelector(`[name=${f.k}]`);v[f.k]=f.t==='number'?r2(parseFloat(String(el.value).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)))||0):el.value.trim()});if(onSave(v)!==false){close();save();render()}};
  return mask;
}
const catOpts=m=>m.cats.map(c=>[c.id,c.icon+' '+c.name]);
function addTx(id){
  const m=M(),t=id&&m.tx.find(x=>x.id===id);
  if(!m.cats.length)return alert('أضف فئة أولاً');
  const mk=form(t?'تعديل مصروف':'إضافة مصروف',[
    {k:'amt',l:'المبلغ',t:'number',v:t?t.amt:''},{k:'cat',l:'الفئة',t:'select',o:catOpts(m),v:t?t.cat:m.cats[0].id},
    {k:'desc',l:'الوصف',v:t?.desc},{k:'date',l:'التاريخ',t:'date',v:t?t.date:today()},
    {k:'pay',l:'وسيلة الدفع',t:'select',o:Object.entries(PAY),v:t?.pay||'card'},{k:'note',l:'ملاحظات (اختياري)',v:t?.note}],
  v=>{if(!(v.amt>0)){alert('أدخل مبلغاً صحيحاً');return false}
    if(t)Object.assign(t,v);else m.tx.push({id:uid(),ts:Date.now(),...v})},
  t?'<button class="btn d" id="del">حذف المصروف</button>':'');
  const d=mk.querySelector('#del');if(d)d.onclick=()=>{if(confirm('حذف هذا المصروف؟')){m.tx=m.tx.filter(x=>x.id!==id);mk.remove();save();render()}};
}
function catForm(id){
  const m=M(),c=id&&m.cats.find(x=>x.id===id);
  const mk=form(c?'تعديل فئة':'فئة جديدة',[{k:'name',l:'الاسم',v:c?.name},{k:'icon',l:'الأيقونة (إيموجي)',v:c?.icon||'📦'},{k:'type',l:'نوع التخصيص',t:'select',o:[['fixed','مبلغ ثابت'],['pct','نسبة من الدخل']],v:c?.type||'fixed'},{k:'val',l:'المبلغ أو النسبة',t:'number',v:c?.val}],
  v=>{if(!v.name){alert('أدخل اسم الفئة');return false}
    if(c)Object.assign(c,v);else m.cats.push({...newCat(v.name,v.icon,v.type,v.val)})},
  c?'<button class="btn d" id="del">حذف الفئة</button>':'');
  const d=mk.querySelector('#del');if(d)d.onclick=()=>{if(m.tx.some(t=>t.cat===id))return alert('لا يمكن حذف فئة عليها مصروفات. انقل المصروفات أو عدّلها أولاً.');if(confirm('حذف الفئة؟')){m.cats=m.cats.filter(x=>x.id!==id);m.transfers=m.transfers.filter(t=>t.from!==id&&t.to!==id);mk.remove();save();render()}};
}

/* ---- الأحداث ---- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,m=M();
  if(a==='tab'){tab=el.dataset.v;render()}
  else if(a==='add')addTx();
  else if(a==='mon'){ensure(shiftKey(S.cur,+el.dataset.v));S.cur=shiftKey(S.cur,+el.dataset.v);ensure(S.cur);save();render()}
  else if(a==='salary')form('الراتب الشهري',[{k:'v',l:'المبلغ',t:'number',v:m.salary||''}],v=>{m.salary=v.v});
  else if(a==='income')form('دخل إضافي / مكافأة / مبلغ مسترد',[{k:'amt',l:'المبلغ',t:'number'},{k:'desc',l:'الوصف'},{k:'date',l:'التاريخ',t:'date',v:today()}],v=>{if(!(v.amt>0))return false;m.extra.push({id:uid(),ts:Date.now(),...v})});
  else if(a==='newcat')catForm();
  else if(a==='editcat')catForm(id);
  else if(a==='catdet'){tab='log';fcat=id;q='';render()}
  else if(a==='transfer')form('نقل مبلغ بين فئات',[{k:'from',l:'من',t:'select',o:catOpts(m)},{k:'to',l:'إلى',t:'select',o:catOpts(m),v:m.cats[1]?.id},{k:'amt',l:'المبلغ',t:'number'},{k:'date',l:'التاريخ',t:'date',v:today()}],v=>{if(v.from===v.to||!(v.amt>0)){alert('اختر فئتين مختلفتين ومبلغاً صحيحاً');return false}m.transfers.push({id:uid(),ts:Date.now(),...v})});
  else if(a==='edittx')addTx(id);
  else if(a==='delother'){if(confirm('حذف هذه العملية؟')){const k=el.dataset.k;if(k==='in')m.extra=m.extra.filter(x=>x.id!==id);else m.transfers=m.transfers.filter(x=>x.id!==id);save();render()}}
  else if(a==='expjson')download('mizaniyati-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json');
  else if(a==='expcsv'){const rows=[['الشهر','التاريخ','الفئة','الوصف','المبلغ','وسيلة الدفع','ملاحظات']];Object.keys(S.months).sort().forEach(k=>{const mm=S.months[k];mm.tx.forEach(t=>rows.push([k,t.date,mm.cats.find(c=>c.id===t.cat)?.name||'',t.desc,t.amt,PAY[t.pay]||'',t.note||'']))});download('mizaniyati-expenses.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
  else if(a==='imp')$('#file').click();
  else if(a==='sample'){if(!confirm('إضافة بيانات تجريبية؟ يمكن حذفها لاحقاً بزر حذف كل البيانات.'))return;m.salary=m.salary||10000;const v=[4000,1500,1200,900,800,600,1000,0,0];m.cats.forEach((c,i)=>{if(!c.val)c.val=v[i]||0});const d=new Date();[['المنزل والمقاضي',320,'سوبرماركت'],['السيارة والبنزين',150,'بنزين'],['المطاعم والترفيه',210,'عشاء'],['الفواتير والاتصالات',230,'إنترنت']].forEach(([n,amt,desc],i)=>{const c=m.cats.find(x=>x.name===n);if(c)m.tx.push({id:uid(),ts:Date.now()+i,cat:c.id,amt,desc:'(تجريبي) '+desc,date:today(),pay:'card',note:''})});save();render()}
  else if(a==='wipe'){if(confirm('سيتم حذف كل بياناتك نهائياً. هل صدّرت نسخة احتياطية؟')&&confirm('تأكيد أخير: حذف كل شيء؟')){localStorage.removeItem(KEY);load();render()}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='fc'){fcat=e.target.value;render()}
  if(e.target.id==='th'){S.theme=e.target.value;save();render()}
  if(e.target.id==='file'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.months)throw 0;if(confirm('سيتم استبدال بياناتك الحالية بالنسخة المستوردة. متابعة؟')){S=d;if(!S.months[S.cur])S.cur=Object.keys(S.months).sort().pop();save();render()}}catch(x){alert('ملف غير صالح')}})}
});
load();render();
if("serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
